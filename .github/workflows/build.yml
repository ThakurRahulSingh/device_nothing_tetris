name: OrangeFox Recovery Builder

on:
  workflow_dispatch:
    inputs:
      FOX_BRANCH:
        description: 'OrangeFox Manifest Branch'
        required: true
        default: '12.1'
        type: choice
        options:
          - '14.1'
          - '12.1'
          - '11.0'
          - '10.0'
      DT_LINK:
        description: 'Device Tree Git Repository URL'
        required: true
        default: 'github.com'
        type: string
      DT_BRANCH:
        description: 'Device Tree Branch'
        required: true
        default: 'fox_12.1'
        type: string
      DEVICE_NAME:
        description: 'Device Codename (e.g., tetris, miatoll)'
        required: true
        default: 'Tetris'
        type: string
      DEVICE_PATH:
        description: 'Device Tree Path (e.g., device/nothing/tetris)'
        required: true
        default: 'device/nothing/tetris'
        type: string
      BUILD_TARGET:
        description: 'Partition containing recovery ramdisk'
        required: true
        default: 'vendor_boot'
        type: choice
        options:
          - 'recovery'
          - 'boot'
          - 'vendor_boot'

jobs:
  build:
    if: github.event.repository.owner.id == github.event.sender.id
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Cleanup
        uses: rokibhasansagar/slimhub_actions@main

      - name: Set Swap Space
        uses: pierotofy/set-swap-space@master
        with:
        swap-size-gb: 24

      - name: Prepare the build environment
        run: |
        sudo apt install git aria2 -y
        git clone https://gitlab.com/OrangeFox/misc/scripts
        cd scripts
        sudo bash setup/android_build_env.sh


      - name: Sync OrangeFox sources
        run: |
        mkdir OrangeFox_sync
        cd OrangeFox_sync
        git clone https://gitlab.com/OrangeFox/sync.git
        cd sync
        ./orangefox_sync.sh --branch ${{ inputs.MANIFEST_BRANCH }} --path ${{ github.workspace }}/fox_${{ inputs.MANIFEST_BRANCH }}
        
      - name: Clone Device Tree
        run: |
          cd ${{ github.workspace }}/ofox/fox_${{ github.event.inputs.FOX_BRANCH }}
          git clone --depth=1 ${{ github.event.inputs.DT_LINK }} -b ${{ github.event.inputs.DT_BRANCH }} ${{ github.event.inputs.DEVICE_PATH }}

      - name: Build OrangeFox Recovery
        run: |
          cd ${{ github.workspace }}/ofox/fox_${{ github.event.inputs.FOX_BRANCH }}
          source build/envsetup.sh
          export ALLOW_MISSING_DEPENDENCIES=true
          export FOX_BUILD_DEVICE=${{ github.event.inputs.DEVICE_NAME }}
          export LC_ALL="C"
          export FOX_BUILD=1

          lunch ${{ github.event.inputs.LUNCH_PREFIX }}_${{ github.event.inputs.DEVICE_NAME }}-eng
          mka adbd ${{ github.event.inputs.BUILD_TARGET }} -j$(nproc --all)

      - name: Upload OrangeFox Output (Zip & Img)
        uses: actions/upload-artifact@v4
        with:
          name: OrangeFox-${{ github.event.inputs.DEVICE_NAME }}-${{ github.event.inputs.FOX_BRANCH }}
          path: |
            ${{ github.workspace }}/ofox/fox_${{ github.event.inputs.FOX_BRANCH }}/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/OrangeFox*.zip
            ${{ github.workspace }}/ofox/fox_${{ github.event.inputs.FOX_BRANCH }}/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/OrangeFox*.img
            ${{ github.workspace }}/ofox/fox_${{ github.event.inputs.FOX_BRANCH }}/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/recovery.img
            ${{ github.workspace }}/ofox/fox_${{ github.event.inputs.FOX_BRANCH }}/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/boot.img
            ${{ github.workspace }}/ofox/fox_${{ github.event.inputs.FOX_BRANCH }}/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/vendor_boot.img
          if-no-files-found: warn